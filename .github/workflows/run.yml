name: 3 Candles Impulse Scanner

on:
  schedule:
    - cron: '1,16,31,46 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - run: python bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
